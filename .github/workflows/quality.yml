# SPDX-License-Identifier: GPL-3.0-only
name: Quality
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  strict:
    runs-on: ubuntu-latest
    container: debian:13
    steps:
      - name: Install native development prerequisites
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates cmake ninja-build patch clang-19 clang-tidy-19 clang-format-19 llvm-19 libclang-rt-19-dev python3 python3-gi gir1.2-gtk-4.0 xvfb xauth dbus-x11
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare pinned native dependency sources
        run: python3 tools/dependencies.py --fetch --ghidra
      - name: Configure, build and check (offline, synthetic inputs)
        run: |
          cmake --preset strict
          cmake --build --preset strict
          cmake --build build/strict --target quality
      - name: Native GTK table lifecycle
        env:
          GSK_RENDERER: cairo
          GTK_A11Y: none
        run: xvfb-run -a dbus-run-session -- /usr/bin/python3 test/gui_smoke.py
